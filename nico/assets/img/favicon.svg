<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mondsichel mit zwei Sternen">
  <!-- Warmer Salbei-Hintergrund, abgerundetes Quadrat -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#5f6d54"/>
  <!-- Mondsichel: heller Vollkreis, davon ein versetzter Kreis in Hintergrundfarbe abgezogen -->
  <path d="M41 14
           a19 19 0 1 0 0 36
           a15 15 0 1 1 0 -36 z"
        fill="#f4efe6"/>
  <!-- Zwei kleine Sternchen -->
  <g fill="#e6dcc8">
    <path d="M47 20 l1.4 3.2 3.2 1.4 -3.2 1.4 -1.4 3.2 -1.4 -3.2 -3.2 -1.4 3.2 -1.4 z"/>
    <path d="M50 34 l0.9 2.1 2.1 0.9 -2.1 0.9 -0.9 2.1 -0.9 -2.1 -2.1 -0.9 2.1 -0.9 z"/>
  </g>
</svg>
